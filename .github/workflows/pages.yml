# Publishes the web cartridge builder (web/) to GitHub Pages: the page, its
# worker, and engine.zip (the engine's sources and tools, with Ophis), put
# together by web/make_site.py. No game data: visitors build from their own
# ROM in their browser. Runs only in the public repository.
name: Web builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: endsWith(github.repository, '/DQ52-Public') || endsWith(github.repository, '/dq52-public')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Put the site together
        run: python web/make_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
